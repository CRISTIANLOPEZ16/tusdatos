services:
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: "${DB_USER:?Set DB_USER in backend/.env}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}"
      DB_NAME: "${DB_NAME:?Set DB_NAME in backend/.env}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-bookworm
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${DB_NAME:?Set DB_NAME in backend/.env}"
      POSTGRES_USER: "${DB_USER:?Set DB_USER in backend/.env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h localhost -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    env_file:
      - ./backend/.env.test
    post_start:
      - command:
          - /bin/bash
          - -ec
          - |
            case "$$DB_NAME" in
              *_test) ;;
              *)
                echo "DB_NAME debe terminar en _test"
                exit 1
                ;;
            esac

            export PGPASSWORD="$$POSTGRES_PASSWORD"

            ready=false
            for attempt in {1..30}; do
              if pg_isready \
                -h 127.0.0.1 \
                -U "$$POSTGRES_USER" \
                -d postgres; then
                ready=true
                break
              fi
              sleep 1
            done

            if [ "$$ready" != true ]; then
              echo "PostgreSQL no estuvo disponible a tiempo"
              exit 1
            fi

            psql \
              --host=127.0.0.1 \
              --username="$$POSTGRES_USER" \
              --dbname=postgres \
              --set=ON_ERROR_STOP=1 \
              --set=test_db="$$DB_NAME" <<'SQL'
            SELECT format('CREATE DATABASE %I', :'test_db')
            WHERE NOT EXISTS (
              SELECT 1 FROM pg_database WHERE datname = :'test_db'
            )
            \gexec
            SQL

volumes:
  postgres_data:
